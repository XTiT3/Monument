<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This site has moved</title>
<style>
  :root {
    --bg: #1b1f2a;
    --panel: #232838;
    --text: #e7e9ee;
    --muted: #9aa3b5;
    --accent: #c9a24b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    text-align: center;
    padding: 48px 36px;
    background: var(--panel);
    border: 1px solid #333a4d;
    border-radius: 6px;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: normal;
    margin: 0 0 16px;
    letter-spacing: 0.3px;
  }
  p {
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 28px;
    font-size: 1rem;
  }
  a.button {
    display: inline-block;
    padding: 14px 28px;
    background: var(--accent);
    color: #1b1f2a;
    text-decoration: none;
    border-radius: 4px;
    font-family: Georgia, serif;
    font-size: 1rem;
    letter-spacing: 0.3px;
    transition: opacity 0.15s ease;
  }
  a.button:hover {
    opacity: 0.85;
  }
  a.button:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>This site has closed</h1>
    <p>The Kingdom's records have moved to a new home. Follow the link below to reach the current site.</p>
    <a class="button" href="https://xtit3.github.io/Kingdom-Event-Tracker/">Go to the new site</a>
  </div>
</body>
</html>
